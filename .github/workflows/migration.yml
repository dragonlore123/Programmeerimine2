name: Generate migration

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Migration name'
        required: true
        default: 'InitialCreate'

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore KooliProjekt.sln

      - name: Add migration
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations add "${{ github.event.inputs.name }}" --project KooliProjekt.Application --startup-project KooliProjekt.WebAPI

      - name: Commit migration
        run: |
          git config user.name "Georg Volov"
          git config user.email "georgvolov@gmail.com"
          git add KooliProjekt.Application/Migrations
          git commit -m "Migratsioon: ${{ github.event.inputs.name }}"
          git push
