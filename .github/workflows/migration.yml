name: Generate migration

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Migration name'
        required: true
        default: 'InitialCreate'

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore KooliProjekt.sln

      - name: Add migration
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations add "${{ github.event.inputs.name }}" --project KooliProjekt.Application --startup-project KooliProjekt.WebAPI

      - uses: actions/upload-artifact@v4
        with:
          name: migrations
          path: KooliProjekt.Application/Migrations/
